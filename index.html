<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#FAF9F7;
    --surface:#FFFFFF;
    --surface-2:#F2F0EB;
    --ink:#1C1B19;
    --ink-muted:#7C766D;
    --border:#E6E2DA;
    --accent:#55493C;
    --accent-strong:#2C2620;
    --accent-soft:#EEE9E1;
    --gold:#8C6A3A;
    --gold-soft:#F3E9D8;
    --danger:#7C3A34;
    --danger-soft:#F3E1DE;
    --radius:14px;
    --shadow:0 1px 2px rgba(28,27,25,.06),0 6px 18px rgba(28,27,25,.06);
    --font-serif:'Jost','Century Gothic','Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15130F;
      --surface:#1E1B17;
      --surface-2:#26221D;
      --ink:#F3F0EA;
      --ink-muted:#A69F92;
      --border:#35302A;
      --accent:#CBC0AE;
      --accent-strong:#F0EBE1;
      --accent-soft:#2C2822;
      --gold:#D2A968;
      --gold-soft:#3A2F1C;
      --danger:#E0938B;
      --danger-soft:#3A2320;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15130F;--surface:#1E1B17;--surface-2:#26221D;--ink:#F3F0EA;--ink-muted:#A69F92;
    --border:#35302A;--accent:#CBC0AE;--accent-strong:#F0EBE1;--accent-soft:#2C2822;
    --gold:#D2A968;--gold-soft:#3A2F1C;--danger:#E0938B;--danger-soft:#3A2320;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#FAF9F7;--surface:#FFFFFF;--surface-2:#F2F0EB;--ink:#1C1B19;--ink-muted:#7C766D;
    --border:#E6E2DA;--accent:#55493C;--accent-strong:#2C2620;--accent-soft:#EEE9E1;
    --gold:#8C6A3A;--gold-soft:#F3E9D8;--danger:#7C3A34;--danger-soft:#F3E1DE;
    --shadow:0 1px 2px rgba(28,27,25,.06),0 6px 18px rgba(28,27,25,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    position:fixed;inset:0;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font-family:inherit;color:inherit;}
  .app-shell{
    max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
    background:var(--bg);position:relative;box-shadow:var(--shadow);
  }
  .login-screen{
    max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;background:var(--bg);
  }
  .login-screen .brand-logo{height:46px;margin-bottom:6px;}
  .login-screen .btn{max-width:280px;}
  .login-status{font-size:.85rem;color:var(--ink-muted);}
  header.topbar{
    flex-shrink:0;padding:16px 18px 12px;border-bottom:1px solid var(--border);
    background:var(--surface);position:relative;
  }
  .privacy-toggle{
    position:absolute;top:14px;right:16px;background:none;border:none;cursor:pointer;
    color:var(--ink-muted);padding:5px;display:flex;border-radius:8px;
  }
  .privacy-toggle svg{width:19px;height:19px;}
  .privacy-toggle.active{color:var(--accent-strong);}
  .settings-toggle{
    position:absolute;top:14px;left:16px;background:none;border:none;cursor:pointer;
    color:var(--ink-muted);padding:5px;display:flex;border-radius:8px;
  }
  .settings-toggle svg{width:19px;height:19px;}
  .settings-toggle.active{color:var(--accent-strong);}
  .brand-logo{display:block;margin:0 auto;height:38px;width:auto;}
  @media (prefers-color-scheme: dark){ .brand-logo{filter:invert(1);} }
  :root[data-theme="dark"] .brand-logo{filter:invert(1);}
  :root[data-theme="light"] .brand-logo{filter:none;}
  .section-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px;
    padding-top:10px;border-top:1px solid var(--border);}
  .section-row #pageTitle{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink);}
  .section-row #pageSubtitle{font-size:.72rem;color:var(--ink-muted);text-align:right;}
  main.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:16px 16px 28px;}
  nav.tabbar{
    flex-shrink:0;display:flex;border-top:1px solid var(--border);background:var(--surface);
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  nav.tabbar button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
    gap:3px;padding:9px 2px 8px;cursor:pointer;color:var(--ink-muted);font-size:.68rem;
    letter-spacing:.01em;
  }
  nav.tabbar button svg{width:21px;height:21px;}
  nav.tabbar button.active{color:var(--accent-strong);font-weight:700;}
  nav.tabbar button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent);outline-offset:1px;
  }

  h2.section-title{font-family:var(--font-serif);font-size:1.1rem;font-weight:500;letter-spacing:.02em;margin:0 0 12px;text-wrap:balance;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;margin-bottom:12px;
  }
  .notice{
    background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-strong);
    border-radius:var(--radius);padding:11px 13px;font-size:.83rem;margin-bottom:14px;line-height:1.4;
  }
  .notice button{background:var(--accent-strong);color:var(--surface);border:none;border-radius:8px;
    padding:6px 10px;font-size:.78rem;font-weight:600;margin-top:8px;cursor:pointer;}

  label.field-label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-muted);margin:0 0 5px;font-weight:600;}
  .field{margin-bottom:12px;}
  .checkbox-row{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .checkbox-row input{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent);cursor:pointer;}
  .checkbox-row span{font-size:.9rem;font-weight:600;}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);
    font-size:.92rem;color:var(--ink);
  }
  textarea{resize:vertical;min-height:52px;}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .money-field{position:relative;}
  .money-field input{padding-left:32px;font-variant-numeric:tabular-nums;}
  .money-field .money-prefix{
    position:absolute;left:10px;top:0;bottom:0;display:flex;align-items:center;
    color:var(--ink-muted);font-size:.88rem;pointer-events:none;
  }
  .money-field.compact input{padding-left:26px;}
  .money-field.compact .money-prefix{left:7px;font-size:.78rem;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .material-row{display:grid;grid-template-columns:1fr 104px 30px;gap:8px;align-items:center;margin-bottom:7px;}
  .material-row input{padding:8px 9px;}
  .icon-btn{background:none;border:none;color:var(--ink-muted);cursor:pointer;padding:4px;
    display:flex;align-items:center;justify-content:center;}
  .icon-btn svg{width:17px;height:17px;}
  .link-btn{background:none;border:none;color:var(--accent-strong);font-weight:600;font-size:.85rem;
    padding:6px 2px;cursor:pointer;}
  .btn{background:var(--accent);color:var(--surface);border:none;border-radius:10px;padding:11px 14px;
    font-size:.92rem;font-weight:700;cursor:pointer;width:100%;}
  .btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn[data-armed="1"]{background:var(--danger);}
  .btn:disabled{opacity:.6;cursor:default;}

  .totals{border-top:1px dashed var(--border);margin-top:6px;padding-top:10px;display:flex;flex-direction:column;gap:6px;}
  .totals .line{display:flex;justify-content:space-between;font-size:.86rem;color:var(--ink-muted);}
  .totals .line span:last-child{font-variant-numeric:tabular-nums;color:var(--ink);}
  .totals .line.big{font-size:1.05rem;font-weight:700;color:var(--ink);border-top:1px solid var(--border);padding-top:8px;margin-top:2px;}
  .totals .line.big span:last-child{color:var(--accent-strong);}
  .totals .line.profit span:last-child{color:var(--gold);}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;}
  .stat-tile .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);font-weight:600;}
  .stat-tile .value{font-family:var(--font-sans);font-size:1.28rem;font-weight:700;font-variant-numeric:tabular-nums;
    margin-top:3px;}
  .stat-tile.gold .value{color:var(--gold);}
  .stat-tile.accent .value{color:var(--accent-strong);}
  .stat-tile.danger .value{color:var(--danger);}

  .patient-item{display:flex;justify-content:space-between;align-items:center;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;margin-bottom:9px;cursor:pointer;}
  .patient-item .name{font-weight:700;font-size:.94rem;}
  .patient-item .sub{font-size:.76rem;color:var(--ink-muted);margin-top:2px;}
  .pill{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.02em;}
  .pill.pago{background:var(--accent-soft);color:var(--accent-strong);}
  .pill.parcial{background:var(--gold-soft);color:var(--gold);}
  .pill.pendente{background:var(--danger-soft);color:var(--danger);}
  .pill.retorno{background:var(--gold-soft);color:var(--gold);margin-left:6px;}

  .treat-item{border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;margin-bottom:10px;background:var(--surface);}
  .treat-item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .treat-item .desc{font-weight:700;font-size:.9rem;}
  .treat-item .date{font-size:.74rem;color:var(--ink-muted);}
  .figures{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:.75rem;color:var(--ink-muted);margin-top:8px;}
  .figures b{display:block;font-size:.86rem;color:var(--ink);font-variant-numeric:tabular-nums;}
  .back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;color:var(--accent-strong);font-weight:600;font-size:.88rem;}
  .back-row svg{width:18px;height:18px;}

  .agenda-day-group{margin-bottom:18px;}
  .agenda-day-header{font-family:var(--font-serif);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;
    font-weight:500;color:var(--ink-muted);margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .agenda-day-header.today{color:var(--accent-strong);font-weight:600;}
  .appt-card{display:flex;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 13px;margin-bottom:9px;}
  .appt-time{flex-shrink:0;width:50px;font-weight:700;font-size:.95rem;color:var(--accent-strong);
    font-variant-numeric:tabular-nums;padding-top:1px;}
  .appt-body{flex:1;min-width:0;}
  .appt-body .desc{font-weight:700;font-size:.9rem;}
  .appt-body .proc{font-size:.78rem;color:var(--ink-muted);margin-top:1px;}

  .empty-state{text-align:center;color:var(--ink-muted);font-size:.85rem;padding:24px 10px;}
  .toast{
    position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:9px 16px;border-radius:99px;font-size:.82rem;font-weight:600;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .25s ease, bottom .25s ease;z-index:50;white-space:nowrap;
  }
  .toast.show{opacity:1;bottom:96px;}
  .segment{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:14px;}
  .segment button{flex:1;border:none;background:none;padding:7px 4px;border-radius:8px;font-size:.8rem;
    font-weight:600;color:var(--ink-muted);cursor:pointer;}
  .segment button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .helper-text{font-size:.76rem;color:var(--ink-muted);margin-top:-6px;margin-bottom:12px;line-height:1.4;}
  .inline-pay{display:flex;gap:8px;margin-top:9px;}
  .inline-pay .money-field{flex:1;}

  .quote-doc{max-width:560px;margin:0 auto;background:#fff;color:#1C1B19;border:1px solid #E6E2DA;border-radius:4px;overflow:hidden;font-family:var(--font-sans);}
  .quote-doc .qd-body{padding:26px 24px 24px;}
  .quote-doc .qd-logo{display:block;width:78%;max-width:340px;height:auto;margin:0 auto;}
  .quote-doc .qd-title{margin-top:22px;padding:16px 0 0 .42em;border-top:1px solid #1C1B19;text-align:center;font-family:var(--font-serif);
    font-size:.82rem;letter-spacing:.42em;text-transform:uppercase;font-weight:500;}
  .quote-doc .qd-meta{text-align:center;font-size:.72rem;color:#7C766D;margin-top:6px;}
  .quote-doc .qd-block{margin-top:22px;}
  .quote-doc .qd-label{font-family:var(--font-serif);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:#7C766D;font-weight:500;margin-bottom:6px;}
  .quote-doc .qd-patient{font-family:var(--font-serif);font-size:1.35rem;font-weight:400;letter-spacing:.02em;}
  .quote-doc .qd-proc{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid #E6E2DA;font-size:.95rem;}
  .quote-doc .qd-proc span:last-child{white-space:nowrap;}
  .quote-doc .qd-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;}
  .quote-doc .qd-total span:first-child{font-family:var(--font-serif);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;}
  .quote-doc .qd-total span:last-child{font-family:var(--font-serif);font-size:1.5rem;font-weight:500;}
  .quote-doc .qd-empty{color:#7C766D;font-size:.82rem;padding:10px 0;}
  .quote-doc .qd-pay{border:1px solid #1C1B19;padding:4px 16px;}
  .quote-doc .qd-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:68px;padding:10px 0;border-bottom:1px solid #E6E2DA;}
  .quote-doc .qd-row:last-child{border-bottom:none;}
  .quote-doc .qd-row > div:first-child{min-width:0;}
  .quote-doc .qd-price{flex-shrink:0;}
  .quote-doc .qd-opt{font-family:var(--font-serif);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;}
  .quote-doc .qd-sub{font-size:.72rem;color:#7C766D;margin-top:3px;}
  .quote-doc .qd-price{font-family:var(--font-serif);font-size:1.35rem;font-weight:500;line-height:1.25;text-align:right;white-space:nowrap;}
  .quote-doc .qd-price small{display:block;margin-top:3px;font-family:var(--font-sans);font-size:.78rem;font-weight:400;color:#7C766D;line-height:1.2;}
  .quote-doc .qd-legal{margin-top:22px;padding-top:14px;border-top:1px solid #E6E2DA;font-size:.74rem;line-height:1.55;color:#7C766D;}
  .quote-doc .qd-sign{margin-top:34px;text-align:center;}
  .quote-doc .qd-sign-line{width:62%;margin:0 auto 10px;border-top:1px solid #1C1B19;}
  .quote-doc .qd-sign-name{font-family:var(--font-serif);font-size:1.05rem;font-weight:500;letter-spacing:.03em;}
  .quote-doc .qd-sign-role{margin-top:3px;font-size:.78rem;color:#1C1B19;}
  .quote-doc .qd-sign-cro{margin-top:2px;font-family:var(--font-serif);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:#7C766D;}
  .quote-item{display:grid;grid-template-columns:1fr 30px;gap:6px 8px;align-items:center;margin-bottom:14px;}
  .quote-item .money-field{grid-column:1;max-width:170px;}
  .quote-item .removeQItem{grid-row:1 / span 2;grid-column:2;}
  .quote-doc .qd-notes{font-size:.84rem;line-height:1.5;white-space:pre-wrap;}
  .quote-doc .qd-foot{background:#1C1B19;padding:20px 24px;display:flex;justify-content:center;}
  .quote-doc .qd-foot img{display:block;width:46px;height:46px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;} }

  @media (min-width:860px){
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .app-shell{
      max-width:1100px;width:100%;height:92vh;max-height:900px;
      display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;
      grid-template-areas:"header header" "nav main";border-radius:20px;overflow:hidden;
    }
    header.topbar{grid-area:header;padding:20px 32px 14px;}
    .privacy-toggle{top:18px;right:30px;}
    .settings-toggle{top:18px;left:auto;right:66px;}
    .brand-logo{margin:0;}
    .section-row{max-width:820px;}
    nav.tabbar{
      grid-area:nav;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;
      border-top:none;border-right:1px solid var(--border);padding:18px 10px;
    }
    nav.tabbar button{
      flex:none;flex-direction:row;justify-content:flex-start;gap:11px;padding:11px 12px;
      border-radius:10px;font-size:.82rem;
    }
    nav.tabbar button:hover{background:var(--surface-2);}
    nav.tabbar button.active{background:var(--accent-soft);}
    main.content{grid-area:main;padding:28px 36px 36px;}
    .stat-grid{grid-template-columns:repeat(3,1fr);}
  }
</style>

  <img class="brand-logo" src="logo.png" alt="Dra. Laura Nunes — Odontologia Clínica e Estética">

  <nav class="tabbar" id="tabbar"></nav>
  <div class="toast" id="toast"></div>
</div>

function todayISO(){ return new Date().toISOString().slice(0,10); }
function r2(v){ return Math.round((Number(v)||0)*100)/100; }
var valuesHidden = localStorage.getItem('valuesHidden')==='1';
function fmtMoney(v){
  if(valuesHidden) return 'R$ ••••';
  v = r2(v); if(Math.abs(v)<0.005) v = 0; return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtDate(iso){ if(!iso) return ''; var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function clamp(n,min,max){ return Math.min(max,Math.max(min,n)); }

function moneyDisplay(v){
  v = Number(v)||0;
  return v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function parseMoneyStr(s){
  if(s==null) return 0;
  s = String(s).trim();
  if(!s) return 0;
  s = s.replace(/[^\d.,-]/g,'');
  var lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  var lastSep = Math.max(lastComma, lastDot);
  var n;
  if(lastSep===-1){ n = parseFloat(s); }
  else{
    var intPart = s.slice(0,lastSep).replace(/[.,]/g,'');
    var decPart = s.slice(lastSep+1).replace(/[.,]/g,'');
    n = parseFloat((intPart||'0')+'.'+(decPart||'0'));
  }
  return isNaN(n) ? 0 : n;
}
function wireMoneyInput(input){
  if(!input) return;
  input.setAttribute('inputmode','decimal');
  input.addEventListener('focus', function(){
    var n = parseMoneyStr(input.value);
    input.value = n ? String(n).replace('.',',') : '';
  });
  input.addEventListener('blur', function(){
    input.value = moneyDisplay(parseMoneyStr(input.value));
  });
}

function dayLabel(dateStr){
  var today = todayISO();
  var tm = new Date(); tm.setDate(tm.getDate()+1);
  var tomorrow = tm.toISOString().slice(0,10);
  if(dateStr===today) return 'Hoje';
  if(dateStr===tomorrow) return 'Amanhã';
  var d = new Date(dateStr+'T00:00:00');
  var s = d.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function groupByDay(list){
  var groups = {}, order = [];
  list.forEach(function(a){
    if(!groups[a.date]){ groups[a.date]=[]; order.push(a.date); }
    groups[a.date].push(a);
  });
  return order.map(function(d){ return { date:d, items:groups[d] }; });
}

    }
    var price = parseMoneyStr(priceInput.value);
    var lucro = price - custoTotal;
    var margem = price>0 ? (lucro/price*100) : 0;
    document.getElementById('sumMaterials').textContent = fmtMoney(materialsSum);
    document.getElementById('sumRoom').textContent = fmtMoney(roomCost);
    document.getElementById('sumCusto').textContent = fmtMoney(custoTotal);
    document.getElementById('sumLucro').textContent = fmtMoney(lucro);
    document.getElementById('sumMargem').textContent = margem.toFixed(0)+'%';
    return { materialsSum:materialsSum, roomCost:roomCost, custoTotal:custoTotal, margin:margem, price:price };
  }
  roomInput.addEventListener('input', updateTotals);
  updateTotals();

  Array.prototype.forEach.call(document.getElementById('agendaSegment').querySelectorAll('button'), function(btn){
    btn.addEventListener('click', function(){ agendaFilter = btn.getAttribute('data-f'); renderAgenda(); });
  });

  // ---- lista agrupada por dia ----
  var listEl = document.getElementById('apptList');
  var list = state.appointments.filter(function(a){ return agendaFilter==='proximos' ? !a.done : !!a.done; });
  list.sort(function(a,b){ return (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')); });
  var groups = groupByDay(list);
  if(agendaFilter==='concluidos') groups.reverse();

  if(groups.length===0){
    listEl.innerHTML = '<div class="empty-state">'+(agendaFilter==='proximos' ? 'Nenhuma consulta agendada.' : 'Nenhuma consulta concluída ainda.')+'</div>';
  } else {
    listEl.innerHTML = groups.map(function(g){
      return '<div class="agenda-day-group">' +
        '<div class="agenda-day-header'+(g.date===todayISO()?' today':'')+'">'+dayLabel(g.date)+'</div>' +
        g.items.map(function(a){
          var linkedTreatment = a.treatmentId ? getTreatment(a.treatmentId) : null;
          var effPrice = linkedTreatment ? linkedTreatment.price : (a.price||0);
          var effPaid = linkedTreatment ? linkedTreatment.paid : (a.paid||0);
          var tbal = effPrice - effPaid;
          var statusClass = tbal<=0.004 ? 'pago' : (effPaid>0 ? 'parcial' : 'pendente');
          var statusLabel = statusClass;
          return '<div class="appt-card" data-id="'+a.id+'">' +
            '<div class="appt-time">'+(a.time||'—')+'</div>' +
            '<div class="appt-body">' +
              '<div class="desc">'+escapeHtml(appointmentPatientName(a))+'</div>' +
              '<div class="proc">'+escapeHtml(a.description)+(a.location ? ' · '+escapeHtml(a.location) : '')+'</div>' +
              (a.notes ? '<p class="helper-text" style="margin:4px 0 0;">'+escapeHtml(a.notes)+'</p>' : '') +
              (agendaFilter==='proximos' ?
                ('<p class="helper-text" style="margin:6px 0 0;">Estimado: <b style="color:var(--ink);">'+fmtMoney(a.price||0)+'</b></p>' +
                '<div style="display:flex;gap:8px;margin-top:8px;">' +
                  '<button class="btn secondary concludeAppt" data-id="'+a.id+'" style="flex:1;">Concluir e cobrar</button>' +
                  '<button class="icon-btn editAppt" data-id="'+a.id+'" title="Editar" style="border:1px solid var(--border);border-radius:9px;">'+ICONS.edit+'</button>' +
                  '<button class="icon-btn waAppt" data-id="'+a.id+'" title="Confirmar por WhatsApp" style="border:1px solid var(--border);border-radius:9px;">'+ICONS.whatsapp+'</button>' +
                  '<button class="icon-btn delAppt" data-id="'+a.id+'" title="Excluir" style="border:1px solid var(--border);border-radius:9px;">'+ICONS.trash+'</button>' +
                '</div>' +
                '<div class="conclude-form" id="conclude-'+a.id+'" style="display:none;margin-top:10px;">' +
                  '<div class="field"><label class="field-label">Valor cobrado</label>' +
                    '<div class="money-field"><span class="money-prefix">R$</span><input type="text" class="ccPrice" value="'+moneyDisplay(a.price||0)+'"></div></div>' +
                  '<p class="helper-text">O pagamento é registrado depois, na aba Pacientes.</p>' +
                  '<button class="btn confirmConclude" data-id="'+a.id+'">Confirmar atendimento</button>' +
                '</div>')
              :
                ('<div class="figures" style="grid-template-columns:1fr 1fr;">' +
                  '<div>Cobrado<b>'+fmtMoney(effPrice)+'</b></div>' +
                  '<div>Recebido<b>'+fmtMoney(effPaid)+'</b></div>' +
                '</div>' +
                '<div class="row-2" style="margin-top:8px;align-items:center;">' +
                  '<span class="pill '+statusClass+'">'+statusLabel+'</span>' +
                  '<button class="btn secondary undoneAppt" data-id="'+a.id+'">Reabrir</button>' +
                '</div>')
              ) +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(listEl.querySelectorAll('.ccPrice'), function(inp){ wireMoneyInput(inp); });
    Array.prototype.forEach.call(listEl.querySelectorAll('.concludeAppt'), function(btn){
      btn.addEventListener('click', function(){
        var form = document.getElementById('conclude-'+btn.getAttribute('data-id'));
        form.style.display = form.style.display==='none' ? 'block' : 'none';
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll('.confirmConclude'), function(btn){
      btn.addEventListener('click', async function(){
        var id = btn.getAttribute('data-id');
        var a = state.appointments.filter(function(x){return x.id===id;})[0];
        if(!a) return;
        var form = document.getElementById('conclude-'+id);
        var price = parseMoneyStr(form.querySelector('.ccPrice').value);
        var custoTotal = (a.materialsCost||0)+(a.roomCost||0);
        var margin = price>0 ? ((price-custoTotal)/price*100) : 0;
        btn.disabled = true;
        try{
          var treatmentData = {
            patientId: a.patientId, date: a.date, description: a.description, location: a.location||'',
            materials: a.materials||[], materialsCost: a.materialsCost||0, roomCost: a.roomCost||0, totalCost: custoTotal,
            margin: margin, price: price, paid: 0, hasReturn: a.hasReturn||false
          };
          var treatmentId = a.treatmentId;
          if(treatmentId){
            await updateDoc(doc(db,'treatments', treatmentId), treatmentData);
          } else {
            var ref = await addDoc(collection(db,'treatments'), treatmentData);
            treatmentId = ref.id;
          }
          await updateDoc(doc(db,'appointments', id), { done:true, price:price, paid:0, treatmentId:treatmentId });
          showToast('Atendimento concluído! Registre o pagamento em Pacientes.');
          renderAgenda();
        }catch(err){
          showToast('Erro ao concluir. Tenta de novo.');
          btn.disabled = false;
        }
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll('.undoneAppt'), function(btn){
      btn.addEventListener('click', async function(){
        var id = btn.getAttribute('data-id');
        var a = state.appointments.filter(function(x){return x.id===id;})[0];
        try{
          if(a && a.treatmentId){ await deleteDoc(doc(db,'treatments', a.treatmentId)); }
          await updateDoc(doc(db,'appointments', id), { done:false, paid:0, treatmentId:null });
          showToast('Reaberto — histórico de pagamento removido');
          renderAgenda();
        }catch(err){ showToast('Erro ao atualizar.'); }
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll('.delAppt'), function(btn){
      btn.addEventListener('click', async function(){
        if(btn.getAttribute('data-armed')==='1'){
          try{ await deleteDoc(doc(db,'appointments', btn.getAttribute('data-id'))); showToast('Agendamento excluído'); renderAgenda(); }
          catch(err){ showToast('Erro ao excluir.'); }
        } else {
          btn.setAttribute('data-armed','1');
          btn.style.color = 'var(--danger)';
          btn.style.borderColor = 'var(--danger)';
          btn.title = 'Clique de novo para confirmar a exclusão';
          setTimeout(function(){ if(btn.isConnected){
            btn.setAttribute('data-armed','0'); btn.style.color=''; btn.style.borderColor=''; btn.title='Excluir';
          } }, 4000);
        }
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll('.editAppt'), function(btn){
      btn.addEventListener('click', function(){
        editingApptId = btn.getAttribute('data-id');
        renderAgenda();
        content.scrollTop = 0;
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll('.scheduleReturn'), function(btn){
      btn.addEventListener('click', function(){
        var a = state.appointments.filter(function(x){return x.id===btn.getAttribute('data-id');})[0];
        if(!a) return;
        returnPrefill = {
          patientName: appointmentPatientName(a),
          description: 'Retorno',
          location: a.location||'',
          notes: 'Retorno de '+a.description+' — atendimento de '+fmtDate(a.date)
        };
        agendaFilter = 'proximos';
        renderAgenda();
        content.scrollTop = 0;
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll('.waAppt'), function(btn){
      btn.addEventListener('click', function(){
        var a = state.appointments.filter(function(x){return x.id===btn.getAttribute('data-id');})[0];
        if(!a) return;
        var patient = getPatient(a.patientId);
        if(!patient || !patient.phone){ showToast('Cadastre o telefone da paciente em Pacientes primeiro'); return; }
        var digits = toWhatsAppDigits(patient.phone);
        var msg = confirmMessage(a, patient);
        window.open('https://wa.me/'+digits+'?text='+encodeURIComponent(msg), '_blank');
      });
    });
  }

  document.getElementById('addAppt').addEventListener('click', async function(){
    var name = document.getElementById('aPatient').value.trim();
    if(!name){ showToast('Informe o nome do paciente'); return; }
    var desc = descSelect.value==='__outro__' ? descCustom.value.trim() : descSelect.value;
    if(!desc){ showToast('Informe o procedimento'); return; }
    var location = locationSelect.value==='__outro__' ? locationCustom.value.trim() : locationSelect.value;
    if(!location){ showToast('Informe o local do atendimento'); return; }
    var date = document.getElementById('aDate').value || todayISO();
    var time = document.getElementById('aTime').value || '';
    var notes = document.getElementById('aNotes').value.trim();
    var hasReturn = document.getElementById('aHasReturn').checked;
    var materials = getMaterials();
    var totals = updateTotals();
    if(desc==='Retorno'){ totals.price = 0; totals.margin = 0; }
    var btn = this;
    btn.disabled = true;
    try{
      var patient = findPatientByName(name);
      var patientId;
      if(patient){ patientId = patient.id; }
      else{
        var newPatientRef = await addDoc(collection(db,'patients'), { name:name, phone:'', notes:'', createdAt: todayISO() });
        patientId = newPatientRef.id;
      }
      var apptData = {
        patientId:patientId, date:date, time:time, description:desc, location:location, notes:notes, hasReturn:hasReturn,
        materials: materials, materialsCost: totals.materialsSum, roomCost: totals.roomCost,
        totalCost: totals.custoTotal, price: totals.price, margin: totals.margin
      };
      if(editingApptId){
        await updateDoc(doc(db,'appointments', editingApptId), apptData);
        showToast('Agendamento atualizado!');
        editingApptId = null;
      } else {
        apptData.done = false;
        apptData.paid = 0;
        await addDoc(collection(db,'appointments'), apptData);
        showToast('Consulta agendada!');
      }
      renderAgenda();
    }catch(err){
      showToast('Erro ao salvar. Tenta de novo.');
      btn.disabled = false;
    }
  });
}

// ---------- ESTOQUE ----------
function renderStock(){
  var content = document.getElementById('content');
  var thisMonth = todayISO().slice(0,7);
  var monthTotal = state.purchases.filter(function(p){return p.date.slice(0,7)===thisMonth;})
    .reduce(function(a,p){return a+p.value;},0);

  content.innerHTML =
    '<div class="card">' +
      '<h2 class="section-title">Registrar compra</h2>' +
      '<div class="field"><label class="field-label">O que foi comprado</label>' +
        '<input type="text" id="pDesc" placeholder="Ex: Caixa de luvas, algodão, gel clareador..."></div>' +
      '<div class="row-2">' +
        '<div class="field"><label class="field-label">Data</label><input type="date" id="pDate" value="'+todayISO()+'"></div>' +
        '<div class="field"><label class="field-label">Valor</label><div class="money-field"><span class="money-prefix">R$</span><input type="text" id="pValue" placeholder="0,00"></div></div>' +
      '</div>' +
      '<button class="btn" id="addPurchase">Adicionar compra</button>' +
    '</div>' +
    '<div class="stat-tile" style="margin-bottom:16px;"><div class="label">Gasto em estoque este mês</div><div class="value">'+fmtMoney(monthTotal)+'</div></div>' +
    '<h2 class="section-title">Compras registradas</h2>' +
    '<div id="purchaseList"></div>';

  wireMoneyInput(document.getElementById('pValue'));
  var listEl = document.getElementById('purchaseList');
  function renderList(){
    var sorted = state.purchases.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
    if(sorted.length===0){
      listEl.innerHTML = '<div class="empty-state">Nenhuma compra registrada ainda.</div>';
      return;
    }
    listEl.innerHTML = sorted.map(function(p){
      return '<div class="treat-item" data-id="'+p.id+'">' +
        '<div class="top"><div><div class="desc">'+escapeHtml(p.description)+'</div><div class="date">'+fmtDate(p.date)+'</div></div>' +
        '<span style="font-weight:700;font-variant-numeric:tabular-nums;">'+fmtMoney(p.value)+'</span></div>' +
        '<button class="icon-btn delPurchase" data-id="'+p.id+'">'+ICONS.trash+' <span style="font-size:.74rem;margin-left:4px;">excluir</span></button>' +
      '</div>';
    }).join('');
    Array.prototype.forEach.call(listEl.querySelectorAll('.delPurchase'), function(btn){
      btn.addEventListener('click', async function(){
        if(btn.getAttribute('data-armed')==='1'){
          try{
            await deleteDoc(doc(db,'purchases', btn.getAttribute('data-id')));
            showToast('Compra excluída');
            renderStock();
          }catch(err){ showToast('Erro ao excluir.'); }
        } else {
          btn.setAttribute('data-armed','1');
          btn.querySelector('span').textContent='confirmar?';
          setTimeout(function(){ if(btn.isConnected){btn.setAttribute('data-armed','0'); btn.querySelector('span').textContent='excluir';} }, 4000);
        }
      });
    });
  }
  renderList();

  document.getElementById('addPurchase').addEventListener('click', async function(){
    var desc = document.getElementById('pDesc').value.trim();
    var date = document.getElementById('pDate').value || todayISO();
    var value = parseMoneyStr(document.getElementById('pValue').value);
    if(!desc){ showToast('Informe o que foi comprado'); return; }
    if(value<=0){ showToast('Informe o valor'); return; }
    try{
      await addDoc(collection(db,'purchases'), { description: desc, date: date, value: value });
      showToast('Compra registrada!');
      renderStock();
    }catch(err){ showToast('Erro ao salvar.'); }
  });
}

// ---------- PACIENTES ----------
function renderPatients(){
  var content = document.getElementById('content');
  if(selectedPatientId){ renderPatientDetail(content); return; }

  var html = '<button class="btn secondary" id="newPatientBtn" style="margin-bottom:14px;">+ novo paciente</button>';
  if(state.patients.length===0){
    html += '<div class="empty-state">Nenhum paciente cadastrado ainda.<br>Use a Calculadora para registrar o primeiro atendimento, ou adicione um paciente aqui.</div>';
  } else {
    var sorted = state.patients.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    html += sorted.map(function(p){
      var bal = patientBalance(p.id);
      var pillClass = bal.balance<=0.004 ? 'pago' : (bal.paid>0 ? 'parcial' : 'pendente');
      var pillLabel = bal.balance<=0.004 ? 'em dia' : (bal.paid>0 ? 'parcial' : 'pendente');
      return '<div class="patient-item" data-id="'+p.id+'">' +
        '<div><div class="name">'+escapeHtml(p.name)+'</div><div class="sub">'+fmtMoney(bal.paid)+' recebido de '+fmtMoney(bal.charged)+'</div></div>' +
        '<span class="pill '+pillClass+'">'+pillLabel+'</span>' +
      '</div>';
    }).join('');
  }
  content.innerHTML = html;

  document.getElementById('newPatientBtn').addEventListener('click', function(){ openNewPatientForm(); });
  Array.prototype.forEach.call(content.querySelectorAll('.patient-item'), function(el){
    el.addEventListener('click', function(){ selectedPatientId = el.getAttribute('data-id'); editingPatientInfo=false; renderPatients(); });
  });
}

function openNewPatientForm(){
  var content = document.getElementById('content');
  content.innerHTML =
    '<div class="card">' +
      '<h2 class="section-title">Novo paciente</h2>' +
      '<div class="field"><label class="field-label">Nome</label><input type="text" id="npName" placeholder="Nome completo"></div>' +
      '<div class="field"><label class="field-label">Telefone (opcional)</label><input type="tel" id="npPhone" placeholder="(00) 00000-0000"></div>' +
      '<div class="field"><label class="field-label">Observações (opcional)</label><textarea id="npNotes" placeholder="Alergias, preferências, etc."></textarea></div>' +
      '<button class="btn" id="npSave">Salvar paciente</button>' +
      '<button class="btn secondary" id="npCancel" style="margin-top:8px;">Cancelar</button>' +
    '</div>';
  document.getElementById('npCancel').addEventListener('click', renderPatients);
  document.getElementById('npSave').addEventListener('click', async function(){
    var name = document.getElementById('npName').value.trim();
    if(!name){ showToast('Informe o nome'); return; }
    try{
      await addDoc(collection(db,'patients'), { name:name, phone: document.getElementById('npPhone').value.trim(),
        notes: document.getElementById('npNotes').value.trim(), createdAt: todayISO() });
      showToast('Paciente adicionado!');
      renderPatients();
    }catch(err){ showToast('Erro ao salvar.'); }
  });
}

function renderPatientDetail(content){
  var p = state.patients.filter(function(x){return x.id===selectedPatientId;})[0];
  if(!p){ selectedPatientId=null; renderPatients(); return; }
  var bal = patientBalance(p.id);
  var treatments = patientTreatments(p.id);
  var nextAppt = nextAppointment(p.id);

  var html = '<div class="back-row" id="backBtn">'+ICONS.back+'<span>Pacientes</span></div>';
  html += '<div class="card">';
  if(editingPatientInfo){
    html +=
      '<div class="field"><label class="field-label">Nome</label><input type="text" id="epName" value="'+escapeHtml(p.name)+'"></div>' +
      '<div class="field"><label class="field-label">Telefone (opcional)</label><input type="tel" id="epPhone" value="'+escapeHtml(p.phone||'')+'" placeholder="(00) 00000-0000"></div>' +
      '<div class="field"><label class="field-label">Observações (opcional)</label><textarea id="epNotes" placeholder="Alergias, preferências, etc.">'+escapeHtml(p.notes||'')+'</textarea></div>' +
      '<div class="row-2">' +
        '<button class="btn secondary" id="epCancel">Cancelar</button>' +
        '<button class="btn" id="epSave">Salvar</button>' +
      '</div>';
  } else {
    html +=
      '<div class="row-2" style="grid-template-columns:1fr auto;align-items:flex-start;">' +
        '<h2 class="section-title" style="margin-bottom:0;">'+escapeHtml(p.name)+'</h2>' +
        '<button class="icon-btn editPatientBtn" title="Editar dados" style="border:1px solid var(--border);border-radius:9px;">'+ICONS.edit+'</button>' +
      '</div>' +
      (p.phone ? '<p class="helper-text" style="margin-bottom:6px;">'+escapeHtml(p.phone)+'</p>' : '') +
      (p.notes ? '<p class="helper-text">'+escapeHtml(p.notes)+'</p>' : '') +
      (nextAppt ? '<div class="notice" style="margin-bottom:0;">Próxima consulta: '+fmtDate(nextAppt.date)+(nextAppt.time?' às '+nextAppt.time:'')+' — '+escapeHtml(nextAppt.description)+(nextAppt.location?' ('+escapeHtml(nextAppt.location)+')':'')+'</div>' : '') +
      '<div class="stat-grid" style="margin-top:8px;margin-bottom:0;">' +
        '<div class="stat-tile accent"><div class="label">Recebido</div><div class="value">'+fmtMoney(bal.paid)+'</div></div>' +
        '<div class="stat-tile '+(bal.balance>0.004?'danger':'')+'"><div class="label">Saldo</div><div class="value">'+fmtMoney(bal.balance)+'</div></div>' +
      '</div>' +
      '<button class="btn danger" id="delPatientBtn" style="margin-top:12px;">Excluir paciente</button>';
  }
  html += '</div>';

  html += '<h2 class="section-title">Histórico de atendimentos</h2>';
  if(treatments.length===0){
    html += '<div class="empty-state">Nenhum atendimento registrado ainda.</div>';
  } else {
    html += treatments.map(function(t){
      var tbal = t.price - t.paid;
      var statusClass = tbal<=0.004 ? 'pago' : (t.paid>0?'parcial':'pendente');
      var statusLabel = tbal<=0.004 ? 'pago' : (t.paid>0?'parcial':'pendente');
      return '<div class="treat-item" data-id="'+t.id+'">' +
        '<div class="top"><div><div class="desc">'+escapeHtml(t.description)+(t.hasReturn?' <span class="pill retorno">retorno previsto</span>':'')+'</div><div class="date">'+fmtDate(t.date)+'</div></div>' +
        '<span class="pill '+statusClass+'">'+statusLabel+'</span></div>' +
        '<div class="figures">' +
          '<div>Custo<b>'+fmtMoney(t.totalCost)+'</b></div>' +
          '<div>Cobrado<b>'+fmtMoney(t.price)+'</b></div>' +
          '<div>Recebido<b>'+fmtMoney(t.paid)+'</b></div>' +
        '</div>' +
        (tbal>0.004 ? (
          '<div class="inline-pay">' +
            '<div class="money-field"><span class="money-prefix">R$</span><input type="text" class="payInput" placeholder="0,00"></div>' +
            '<button class="link-btn registerPay" data-id="'+t.id+'">registrar</button>' +
          '</div>'
        ) : '') +
        '<button class="icon-btn delTreat" data-id="'+t.id+'" style="margin-top:6px;">'+ICONS.trash+' <span style="font-size:.74rem;margin-left:4px;">excluir</span></button>' +
      '</div>';
    }).join('');
  }
  content.innerHTML = html;

  document.getElementById('backBtn').addEventListener('click', function(){ selectedPatientId=null; editingPatientInfo=false; renderPatients(); });

  if(editingPatientInfo){
    document.getElementById('epCancel').addEventListener('click', function(){ editingPatientInfo=false; renderPatientDetail(content); });
    document.getElementById('epSave').addEventListener('click', async function(){
      var name = document.getElementById('epName').value.trim();
      if(!name){ showToast('Informe o nome'); return; }
      try{
        await updateDoc(doc(db,'patients', p.id), {
          name:name,
          phone: document.getElementById('epPhone').value.trim(),
          notes: document.getElementById('epNotes').value.trim()
        });
        editingPatientInfo = false;
        showToast('Dados atualizados!');
        renderPatientDetail(content);
      }catch(err){ showToast('Erro ao salvar.'); }
    });
  } else {
    content.querySelector('.editPatientBtn').addEventListener('click', function(){ editingPatientInfo=true; renderPatientDetail(content); });

    var delBtn = document.getElementById('delPatientBtn');
    delBtn.addEventListener('click', async function(){
      if(delBtn.getAttribute('data-armed')==='1'){
        try{
          var batch = writeBatch(db);
          batch.delete(doc(db,'patients',p.id));
          patientTreatments(p.id).forEach(function(t){ batch.delete(doc(db,'treatments',t.id)); });
          state.appointments.filter(function(a){return a.patientId===p.id;}).forEach(function(a){ batch.delete(doc(db,'appointments',a.id)); });
          await batch.commit();
          selectedPatientId = null;
          showToast('Paciente excluído');
          renderPatients();
        }catch(err){ showToast('Erro ao excluir.'); }
      } else {
        delBtn.setAttribute('data-armed','1');
        delBtn.textContent = 'Confirmar exclusão?';
        setTimeout(function(){ delBtn.setAttribute('data-armed','0'); delBtn.textContent='Excluir paciente'; }, 4000);
      }
    });
  }

  Array.prototype.forEach.call(content.querySelectorAll('.payInput'), function(inp){ wireMoneyInput(inp); });
  Array.prototype.forEach.call(content.querySelectorAll('.registerPay'), function(btn){
    btn.addEventListener('click', async function(){
      var row = btn.closest('.inline-pay');
      var val = parseMoneyStr(row.querySelector('.payInput').value);
      if(val<=0){ showToast('Informe um valor'); return; }
      var t = state.treatments.filter(function(x){return x.id===btn.getAttribute('data-id');})[0];
      try{
        await updateDoc(doc(db,'treatments', t.id), { paid: t.paid + val });
        showToast('Pagamento registrado!');
        renderPatientDetail(content);
      }catch(err){ showToast('Erro ao registrar.'); }
    });
  });
  Array.prototype.forEach.call(content.querySelectorAll('.delTreat'), function(btn){
    btn.addEventListener('click', async function(){
      if(btn.getAttribute('data-armed')==='1'){
        try{
          await deleteDoc(doc(db,'treatments', btn.getAttribute('data-id')));
          showToast('Atendimento excluído');
          renderPatientDetail(content);
        }catch(err){ showToast('Erro ao excluir.'); }
      } else {
        btn.setAttribute('data-armed','1');
        btn.querySelector('span').textContent='confirmar?';
        setTimeout(function(){ if(btn.isConnected){btn.setAttribute('data-armed','0'); btn.querySelector('span').textContent='excluir';} }, 4000);
      }
    });
  });
}

var quoteDraft = null;
var QUOTE_INSTALLMENTS = 12;
var QUOTE_LEGAL = 'A quantidade e a técnica serão definidas após avaliação individual, respeitando a anatomia e os objetivos da paciente. A indicação, os benefícios esperados, os possíveis riscos e os cuidados após o procedimento serão explicados durante a avaliação.';

function isoLocal(d){
  var m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
}
function newQuoteDraft(){
  return { patient:'', items:[{desc:'',value:''}], card:'',
    date:isoLocal(new Date()), validDays:15, notes:'' };
}
function brl(v){ return r2(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

function quoteSigner(){
  var s = state.settings || {};
  return { name:(s.signName||'').trim() || 'Dra. Laura Nunes', cro:(s.cro||'').trim() || 'CRO 22095' };
}

function quoteCalc(q){
  var items = q.items.map(function(i){ return { desc:i.desc.trim(), value:parseMoneyStr(i.value) }; })
    .filter(function(i){ return i.desc || i.value; });
  var total = r2(items.reduce(function(a,i){ return a+i.value; },0));
  var d = new Date((q.date || isoLocal(new Date()))+'T00:00:00');
  d.setDate(d.getDate()+(Number(q.validDays)||0));
  var card = r2(parseMoneyStr(q.card));
  return { items:items, total:total, card:card, inst:r2(card/QUOTE_INSTALLMENTS), validUntil:isoLocal(d) };
}

function quoteHTML(q){
  var c = quoteCalc(q);
  var sig = quoteSigner();
  var rows = c.items.length ? c.items.map(function(i){
    return '<div class="qd-proc"><span>'+escapeHtml(i.desc||'Procedimento')+'</span><span>'+brl(i.value)+'</span></div>';
  }).join('') : '<div class="qd-empty">Nenhum procedimento adicionado</div>';
  var pay = '<div class="qd-row"><div class="qd-opt">À vista no Pix</div>' +
    '<div class="qd-price">'+brl(c.total)+'</div></div>';
  if(c.card>0){

      '<div class="qd-price">'+brl(c.card)+'<small>ou '+QUOTE_INSTALLMENTS+'x de '+brl(c.inst)+'</small></div></div>';
  }
  return '<div class="quote-doc" id="quoteDoc">' +
    '<div class="qd-body">' +
      '<img class="qd-logo" src="logo.png" alt="Dra. Laura Nunes — Odontologia Clínica e Estética">' +
      '<div class="qd-title">Orçamento</div>' +
      '<div class="qd-meta">Emitido em '+fmtDate(q.date)+' &middot; Válido até '+fmtDate(c.validUntil)+'</div>' +
      '<div class="qd-block"><div class="qd-label">Paciente</div><div class="qd-patient">'+(q.patient.trim()?escapeHtml(q.patient.trim()):'&mdash;')+'</div></div>' +
      '<div class="qd-block"><div class="qd-label">Procedimentos</div>'+rows +
        '<div class="qd-total"><span>Valor total</span><span>'+brl(c.total)+'</span></div></div>' +
      '<div class="qd-block"><div class="qd-label">Condições de pagamento</div><div class="qd-pay">'+pay+'</div></div>' +
      (q.notes.trim() ? '<div class="qd-block"><div class="qd-label">Observações</div><div class="qd-notes">'+escapeHtml(q.notes.trim())+'</div></div>' : '') +
      '<div class="qd-legal">'+QUOTE_LEGAL+'</div>' +
      '<div class="qd-sign"><div class="qd-sign-line"></div>' +
        '<div class="qd-sign-name">'+escapeHtml(sig.name)+'</div>' +
        '<div class="qd-sign-role">Cirurgiã-Dentista</div>' +
        (sig.cro ? '<div class="qd-sign-cro">'+escapeHtml(sig.cro)+'</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="qd-foot"><img src="ln-mark-white.png" alt=""></div>' +
  '</div>';
}

function quoteText(q){
  var c = quoteCalc(q);
  var t = '';
  if(q.patient.trim()) t += 'Olá, '+q.patient.trim().split(' ')[0]+'! Segue o seu orçamento:\n\n';
  t += '*Orçamento — Dra. Laura Nunes*\n';
  t += 'Data: '+fmtDate(q.date)+' (válido até '+fmtDate(c.validUntil)+')\n\n';
  t += '*Procedimentos*\n';
  c.items.forEach(function(i){ t += '• '+(i.desc||'Procedimento')+' — '+brl(i.value)+'\n'; });
  t += '\n*Valor total: '+brl(c.total)+'*\n';
  t += '\n*À vista no Pix: '+brl(c.total)+'*\n';
  if(c.card>0){
    t += '*Cartão de crédito em até '+QUOTE_INSTALLMENTS+'x: '+brl(c.card)+'* (ou '+QUOTE_INSTALLMENTS+'x de '+brl(c.inst)+')\n';
  }
  if(q.notes.trim()) t += '\nObs.: '+q.notes.trim()+'\n';
  var sig = quoteSigner();
  t += '\n'+QUOTE_LEGAL+'\n\n'+sig.name+'\nCirurgiã-Dentista'+(sig.cro?' | '+sig.cro:'');
  return t.trim();
}

function quoteFileName(q){
  var slug = q.patient.trim().normalize('NFD').replace(/[^ -~]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return 'Orcamento-'+(slug||'paciente')+'-'+(q.date||isoLocal(new Date()))+'.pdf';
}

async function buildQuotePdf(q){
  if(!window.html2canvas || !window.jspdf) throw new Error('pdf-unavailable');
  // Captura uma cópia fora da tela com largura fixa, para o PDF sair igual no celular e no computador.
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-10000px;top:0;width:560px;';
  wrap.innerHTML = quoteHTML(q).replace(' id="quoteDoc"', '');
  var el = wrap.firstChild;
  el.style.cssText += 'border:none;border-radius:0;max-width:none;width:560px;margin:0;';
  document.body.appendChild(wrap);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all(Array.prototype.map.call(el.querySelectorAll('img'), function(img){
      return img.complete ? null : new Promise(function(r){ img.onload = img.onerror = r; });
    }));
    var canvas = await window.html2canvas(el, { scale:3, backgroundColor:'#ffffff', useCORS:true, logging:false });
    var wMm = 150, hMm = wMm*canvas.height/canvas.width;
    var pdf = new window.jspdf.jsPDF({ unit:'mm', format:[wMm,hMm], orientation:hMm>wMm?'portrait':'landscape' });
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92), 'JPEG', 0, 0, wMm, hMm);
    return new File([pdf.output('blob')], quoteFileName(q), { type:'application/pdf' });
  } finally {
    wrap.remove();
  }
}

function downloadFile(file){
  var url = URL.createObjectURL(file);
  var a = document.createElement('a');
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

        '</div>' +

          '<textarea id="qNotes" placeholder="Ex: valores sujeitos a avaliação clínica...">'+escapeHtml(q.notes)+'</textarea></div>' +
      '</div>' +

  var itemsEl = document.getElementById('qItems');

  function readForm(){
    q.patient = document.getElementById('qPatient').value;

    row.innerHTML =
      '<input type="text" class="qDesc" list="qProcList" placeholder="Procedimento" value="'+escapeHtml(item.desc||'')+'">' +
      '<div class="money-field compact"><span class="money-prefix">R$</span><input type="text" class="qVal" placeholder="0,00" value="'+(item.value?moneyDisplay(parseMoneyStr(item.value)):'')+'"></div>' +
      '<button type="button" class="icon-btn removeQItem">'+ICONS.trash+'</button>';
    itemsEl.appendChild(row);
    wireMoneyInput(row.querySelector('.qVal'));
    row.querySelectorAll('input').forEach(function(inp){ inp.addEventListener('input', readForm); });

  }
  q.items.forEach(addItemRow);

  ['qPatient','qCard','qDate','qValid','qNotes'].forEach(function(id){

  });
  document.getElementById('qAddItem').addEventListener('click', function(){

  // O PDF é gerado em segundo plano logo após a edição, para o toque em "Enviar" abrir o

  var pdfTimer = null;
  var pdfCache = { key:null, file:null };
  function quoteKey(){ return JSON.stringify(q); }
  function schedulePdf(){
    clearTimeout(pdfTimer);
    if(!q.patient.trim() || quoteCalc(q).total<=0) return;
    pdfTimer = setTimeout(async function(){
      if(!document.getElementById('quoteDoc')) return;
      var key = quoteKey();
      if(pdfCache.key===key) return;
      try{
        var f = await buildQuotePdf(q);
        if(key===quoteKey()){ pdfCache.key = key; pdfCache.file = f; }
      }catch(e){}
    }, 900);
  }
  async function getPdf(){
    var key = quoteKey();
    if(pdfCache.key===key && pdfCache.file) return pdfCache.file;
    var f = await buildQuotePdf(q);
    pdfCache.key = key; pdfCache.file = f;
    return f;
  }
  function checkReady(){
    readForm();
    if(!q.patient.trim()){ showToast('Informe o nome da paciente'); return false; }
    var c = quoteCalc(q);
    if(!c.items.length){ showToast('Adicione ao menos um procedimento'); return false; }
    if(c.total<=0){ showToast('Informe o valor dos procedimentos'); return false; }
    return true;
  }
  function openChat(){
    var p = findPatientByName(q.patient);
    var digits = (p && p.phone) ? toWhatsAppDigits(p.phone) : '';
    window.open('https://wa.me/'+digits+'?text='+encodeURIComponent(quoteText(q)), '_blank');
  }

  var sendBtn = document.getElementById('qSendPdf');
  var sendLabel = sendBtn.textContent;
  sendBtn.addEventListener('click', async function(){
    sendBtn.textContent = sendLabel;
    if(!checkReady()) return;
    var file = (pdfCache.key===quoteKey()) ? pdfCache.file : null;
    if(!file){
      sendBtn.disabled = true; sendBtn.textContent = 'Gerando PDF…';
      try{ file = await getPdf(); }
      catch(err){ showToast('Não consegui gerar o PDF. Confira a internet e tente de novo.'); return; }
      finally{ sendBtn.disabled = false; sendBtn.textContent = sendLabel; }
    }
    var shareData = { files:[file], title:'Orçamento — Dra. Laura Nunes',
      text:'Olá, '+q.patient.trim().split(' ')[0]+'! Segue o seu orçamento.' };
    if(navigator.canShare && navigator.canShare(shareData)){
      try{ await navigator.share(shareData); return; }
      catch(err){
        if(err && err.name==='AbortError') return;
        if(err && err.name==='NotAllowedError'){
          sendBtn.textContent = 'Toque de novo para enviar';
          showToast('PDF pronto — toque de novo para enviar');
          return;
        }
      }
    }
    downloadFile(file);
    openChat();
    showToast('PDF baixado — anexe na conversa do WhatsApp');
  });

  document.getElementById('qDownload').addEventListener('click', async function(){
    if(!checkReady()) return;
    var btn = this, label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Gerando…';
    try{ downloadFile(await getPdf()); }
    catch(err){ showToast('Não consegui gerar o PDF. Confira a internet e tente de novo.'); }
    btn.disabled = false; btn.textContent = label;
  });
  document.getElementById('qChat').addEventListener('click', function(){ if(checkReady()) openChat(); });
  document.getElementById('qClear').addEventListener('click', function(){ quoteDraft = newQuoteDraft(); renderQuote(); });

  readForm();
}

// ---------- RESUMO ----------
var summaryMonth = todayISO().slice(0,7);

function monthLabel(ym){
  var d = new Date(Number(ym.slice(0,4)), Number(ym.slice(5,7))-1, 1);
  var s = d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function renderSummary(){
  var content = document.getElementById('content');

  var months = {};
  state.treatments.forEach(function(t){ months[t.date.slice(0,7)] = true; });
  state.purchases.forEach(function(p){ months[p.date.slice(0,7)] = true; });
  months[summaryMonth] = true;
  var monthKeys = Object.keys(months).sort().reverse();

  function agg(treats, purchs){
    var faturado=0, custoAtend=0, recebido=0;
    treats.forEach(function(t){ faturado+=t.price; custoAtend+=t.totalCost; recebido+=t.paid; });
    var custoEstoque = purchs.reduce(function(a,p){return a+p.value;},0);
    var custo = custoAtend+custoEstoque;
    return { faturado:faturado, custo:custo, recebido:recebido, lucro:faturado-custo, aReceber: faturado-recebido, qtd: treats.length };
  }
  var monthTreats = state.treatments.filter(function(t){ return t.date.slice(0,7)===summaryMonth; });
  var monthPurchs = state.purchases.filter(function(p){ return p.date.slice(0,7)===summaryMonth; });
  var monthAgg = agg(monthTreats, monthPurchs);
  var totalAgg = agg(state.treatments, state.purchases);

  function tiles(a){
    return '<div class="stat-grid">' +
      '<div class="stat-tile"><div class="label">Atendimentos</div><div class="value">'+a.qtd+'</div></div>' +
      '<div class="stat-tile"><div class="label">Faturado</div><div class="value">'+fmtMoney(a.faturado)+'</div></div>' +
      '<div class="stat-tile danger"><div class="label">Custos</div><div class="value">'+fmtMoney(a.custo)+'</div></div>' +
      '<div class="stat-tile gold"><div class="label">Lucro estimado</div><div class="value">'+fmtMoney(a.lucro)+'</div></div>' +
      '<div class="stat-tile accent"><div class="label">A receber</div><div class="value">'+fmtMoney(a.aReceber)+'</div></div>' +
    '</div>';
  }

  content.innerHTML =
    '<div class="field"><label class="field-label">Ver mês</label>' +
      '<select id="summaryMonthSelect">'+monthKeys.map(function(k){
        return '<option value="'+k+'"'+(k===summaryMonth?' selected':'')+'>'+monthLabel(k)+'</option>';
      }).join('')+'</select>' +
    '</div>' +
    tiles(monthAgg) +
    '<h2 class="section-title">Total (todo período)</h2>' + tiles(totalAgg) +
    '<p class="helper-text">Lucro estimado = faturado − custos (materiais + sala dos atendimentos + compras de estoque). "A receber" considera atendimentos já cobrados mas ainda não pagos integralmente.</p>';

  document.getElementById('summaryMonthSelect').addEventListener('change', function(e){
    summaryMonth = e.target.value;
    renderSummary();
  });
}

      });
    }, 500);
  }
  wireMoneyInput(document.getElementById('sRoom'));
  document.getElementById('sRoom').addEventListener('input', persistSettings);
  document.getElementById('sMargin').addEventListener('input', persistSettings);
  document.getElementById('sSignName').addEventListener('input', persistSettings);
  document.getElementById('sCro').addEventListener('input', persistSettings);
  document.getElementById('signOutBtn').addEventListener('click', function(){ signOut(auth); });

  document.getElementById('exportBtn').addEventListener('click', function(){
    var data = JSON.stringify(state, null, 2);
    var filename = 'backup-consultorio-'+todayISO()+'.json';
    if(window.claude && window.claude.downloads){
      window.claude.downloads.save({ filename: filename, data: data }).catch(function(){ showToast('Não foi possível salvar o backup'); });
    } else {
      var blob = new Blob([data], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  });
  var importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', function(){ importFile.click(); });
  importFile.addEventListener('change', function(){
    var file = importFile.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = async function(){
      try{
        var parsed = JSON.parse(reader.result);
        var batch = writeBatch(db);
        (parsed.patients||[]).forEach(function(p){ var d=Object.assign({},p); var id=d.id; delete d.id; if(id) batch.set(doc(db,'patients', id), d); });
        (parsed.treatments||[]).forEach(function(t){ var d=Object.assign({},t); var id=d.id; delete d.id; if(id) batch.set(doc(db,'treatments', id), d); });
        (parsed.purchases||[]).forEach(function(x){ var d=Object.assign({},x); var id=d.id; delete d.id; if(id) batch.set(doc(db,'purchases', id), d); });
        (parsed.appointments||[]).forEach(function(a){ var d=Object.assign({},a); var id=d.id; delete d.id; if(id) batch.set(doc(db,'appointments', id), d); });
        batch.set(doc(db,'settings','main'), parsed.settings || { defaultRoomCost:0, defaultMargin:30 });
        await batch.commit();
        showToast('Backup importado!');
      }catch(e){ showToast('Arquivo inválido'); }
    };
    reader.readAsText(file);
  });
}

// ---------- AUTENTICAÇÃO ----------
var unsubscribers = [];
function stopListeners(){ unsubscribers.forEach(function(u){ u(); }); unsubscribers = []; }

function onDataChanged(){
  if(activeTab==='agenda' || activeTab==='quote') return;
  var el = document.activeElement;
  if(activeTab==='settings' && el && (el.id==='sRoom' || el.id==='sMargin' || el.id==='sSignName' || el.id==='sCro')) return;
  renderAll();
}

function startListeners(){
  unsubscribers.push(onSnapshot(collection(db,'patients'), function(snap){
    state.patients = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    onDataChanged();
  }));
  unsubscribers.push(onSnapshot(collection(db,'treatments'), function(snap){
    state.treatments = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    onDataChanged();
  }));
  unsubscribers.push(onSnapshot(collection(db,'purchases'), function(snap){
    state.purchases = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    onDataChanged();
  }));
  unsubscribers.push(onSnapshot(collection(db,'appointments'), function(snap){
    state.appointments = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    onDataChanged();
  }));
  unsubscribers.push(onSnapshot(doc(db,'settings','main'), function(snap){
    state.settings = snap.exists() ? snap.data() : { defaultRoomCost:0, defaultMargin:30 };
    onDataChanged();
  }));
  renderAll();
}

var loginScreen = document.getElementById('loginScreen');
var appShell = document.getElementById('appShell');
var loginStatus = document.getElementById('loginStatus');
var googleBtn = document.getElementById('googleSignInBtn');
var loginError = document.getElementById('loginError');

googleBtn.addEventListener('click', function(){
  var provider = new GoogleAuthProvider();
  signInWithPopup(auth, provider).catch(function(err){
    if(err && err.code==='auth/popup-blocked'){
      signInWithRedirect(auth, provider);
    } else if(err && err.code!=='auth/cancelled-popup-request' && err.code!=='auth/popup-closed-by-user'){
      loginError.style.display='block';
      loginError.textContent = 'Não foi possível entrar. Tenta de novo.';
    }
  });
});

getRedirectResult(auth).catch(function(){});

onAuthStateChanged(auth, function(user){
  if(!user){
    stopListeners();
    appShell.style.display='none';
    loginScreen.style.display='flex';
    loginStatus.textContent = 'Acesso restrito ao consultório.';
    googleBtn.style.display='block';
    return;
  }
  if(ALLOWED_EMAILS.indexOf(user.email)===-1){
    stopListeners();
    appShell.style.display='none';
    loginScreen.style.display='flex';
    loginStatus.textContent = '';
    googleBtn.style.display='block';
    loginError.style.display='block';
    loginError.textContent = 'O e-mail '+user.email+' não tem acesso a este sistema.';
    signOut(auth);
    return;
  }
  loginError.style.display='none';
  loginScreen.style.display='none';
  appShell.style.display='';
  startListeners();
});
</script>
